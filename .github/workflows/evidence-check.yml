name: Evidence integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile committed Python source
        run: python -m compileall -q Problem1_of_Project1.py

      - name: Verify committed evidence artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv

          required = [
              Path('README.md'),
              Path('heart1.csv'),
              Path('Project1_Dossiya.pdf'),
              Path('assets/correlation_heatmap.png'),
              Path('assets/covariance_heatmap.png'),
              Path('assets/pairplot.png'),
              Path('Problem1_of_Project1.py'),
          ]

          for path in required:
              if not path.exists():
                  raise SystemExit(f'Missing required evidence artifact: {path}')
              if path.stat().st_size <= 0:
                  raise SystemExit(f'Empty required evidence artifact: {path}')

          with Path('heart1.csv').open(newline='', encoding='utf-8') as handle:
              reader = csv.DictReader(handle)
              if not reader.fieldnames or 'a1p2' not in reader.fieldnames:
                  raise SystemExit('heart1.csv is missing declared target column a1p2')
              row_count = sum(1 for _ in reader)
              if row_count < 1:
                  raise SystemExit('heart1.csv contains no data rows')

          readme = Path('README.md').read_text(encoding='utf-8')
          markers = [
              'artifact-verifiable but not yet source-reproducible',
              'placeholder code',
              'Correlation is used here as an **association diagnostic**, not evidence of causation.',
          ]
          for marker in markers:
              if marker not in readme:
                  raise SystemExit(f'README rigor marker missing: {marker}')

          print(f'Evidence integrity passed: {row_count} CSV rows; {len(required)} required artifacts.')
          PY
