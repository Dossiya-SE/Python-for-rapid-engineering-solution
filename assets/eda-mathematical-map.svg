<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">EDA mathematical map</title><desc id="d">Visual representation of feature vectors, covariance and correlation matrices, pairwise geometry and evidence integrity.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102338"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#7dd3fc"/></marker></defs><rect width="1600" height="720" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial"><text x="70" y="70" fill="#eff9ff" font-size="31" font-weight="800">EXPLORATORY DATA ANALYSIS — MATHEMATICAL VIEW</text><text x="70" y="102" fill="#9cc7df" font-size="16">feature space → covariance structure → normalized association → pairwise geometry → bounded interpretation</text>
<rect x="70" y="145" width="290" height="215" rx="18" fill="#0d2740" stroke="#38bdf8"/><text x="94" y="180" fill="#7dd3fc" font-size="19" font-weight="700">Feature vector</text><text x="94" y="218" fill="#e7f6ff" font-size="17">x = [x₁, x₂, …, xₚ]ᵀ</text><g fill="#38bdf8"><circle cx="115" cy="280" r="8"/><circle cx="160" cy="250" r="8"/><circle cx="205" cy="302" r="8"/><circle cx="250" cy="236" r="8"/><circle cx="305" cy="270" r="8"/></g><path d="M115 280L160 250L205 302L250 236L305 270" fill="none" stroke="#7dd3fc" stroke-width="3"/>
<path d="M360 252H420" stroke="#7dd3fc" stroke-width="3" marker-end="url(#a)"/>
<rect x="420" y="145" width="310" height="215" rx="18" fill="#0d2740" stroke="#34d399"/><text x="444" y="180" fill="#86efac" font-size="19" font-weight="700">Covariance</text><text x="444" y="214" fill="#e8fff2" font-size="16">Σ = E[(X−μ)(X−μ)ᵀ]</text><g transform="translate(463 242)"><rect width="42" height="42" fill="#0c4a6e"/><rect x="44" width="42" height="42" fill="#155e75"/><rect x="88" width="42" height="42" fill="#164e63"/><rect y="44" width="42" height="42" fill="#155e75"/><rect x="44" y="44" width="42" height="42" fill="#047857"/><rect x="88" y="44" width="42" height="42" fill="#065f46"/><rect y="88" width="42" height="42" fill="#164e63"/><rect x="44" y="88" width="42" height="42" fill="#065f46"/><rect x="88" y="88" width="42" height="42" fill="#78350f"/></g><text x="610" y="298" fill="#a7f3d0" font-size="12">scale-sensitive</text>
<path d="M730 252H790" stroke="#7dd3fc" stroke-width="3" marker-end="url(#a)"/>
<rect x="790" y="145" width="310" height="215" rx="18" fill="#0d2740" stroke="#fbbf24"/><text x="814" y="180" fill="#fde68a" font-size="19" font-weight="700">Correlation</text><text x="814" y="214" fill="#fff7df" font-size="16">ρᵢⱼ = Σᵢⱼ/(σᵢσⱼ)</text><line x1="830" y1="326" x2="1055" y2="326" stroke="#62788c"/><line x1="830" y1="326" x2="830" y2="245" stroke="#62788c"/><g fill="#fbbf24"><circle cx="850" cy="310" r="5"/><circle cx="885" cy="298" r="5"/><circle cx="920" cy="282" r="5"/><circle cx="960" cy="270" r="5"/><circle cx="1000" cy="255" r="5"/></g><path d="M842 315L1010 250" stroke="#fbbf24" stroke-width="3"/><text x="870" y="344" fill="#fcd88a" font-size="12">association ≠ causation</text>
<path d="M1100 252H1160" stroke="#7dd3fc" stroke-width="3" marker-end="url(#a)"/>
<rect x="1160" y="145" width="370" height="215" rx="18" fill="#0d2740" stroke="#c084fc"/><text x="1184" y="180" fill="#d8b4fe" font-size="19" font-weight="700">Pairwise geometry</text><text x="1184" y="214" fill="#f5ebff" font-size="16">projection of multivariate structure</text><ellipse cx="1270" cy="292" rx="70" ry="28" transform="rotate(-24 1270 292)" fill="none" stroke="#38bdf8" stroke-width="3"/><ellipse cx="1410" cy="285" rx="55" ry="38" transform="rotate(18 1410 285)" fill="none" stroke="#fb7185" stroke-width="3"/><g fill="#c4b5fd"><circle cx="1235" cy="305" r="4"/><circle cx="1260" cy="292" r="4"/><circle cx="1295" cy="278" r="4"/><circle cx="1378" cy="270" r="4"/><circle cx="1415" cy="291" r="4"/><circle cx="1445" cy="304" r="4"/></g>
<rect x="70" y="410" width="1460" height="225" rx="20" fill="#0b2237" stroke="#2b617f"/><text x="94" y="448" fill="#7dd3fc" font-size="19" font-weight="700">Evidence integrity pipeline</text><path d="M115 535H1480" stroke="#38bdf8" stroke-width="4" marker-end="url(#a)"/><g font-size="13" font-weight="700"><rect x="100" y="500" width="170" height="70" rx="14" fill="#0c4a6e" stroke="#38bdf8"/><text x="185" y="530" text-anchor="middle" fill="#fff">heart1.csv</text><text x="185" y="550" text-anchor="middle" fill="#bae6fd" font-size="10">declared target a1p2</text><rect x="310" y="500" width="170" height="70" rx="14" fill="#064e3b" stroke="#34d399"/><text x="395" y="530" text-anchor="middle" fill="#fff">EDA artifacts</text><text x="395" y="550" text-anchor="middle" fill="#bbf7d0" font-size="10">heatmaps + pairplot</text><rect x="520" y="500" width="170" height="70" rx="14" fill="#3b0764" stroke="#c084fc"/><text x="605" y="530" text-anchor="middle" fill="#fff">report</text><text x="605" y="550" text-anchor="middle" fill="#e9d5ff" font-size="10">human interpretation</text><rect x="730" y="500" width="170" height="70" rx="14" fill="#78350f" stroke="#fbbf24"/><text x="815" y="530" text-anchor="middle" fill="#fff">source status</text><text x="815" y="550" text-anchor="middle" fill="#fde68a" font-size="10">analysis code incomplete</text><rect x="940" y="500" width="170" height="70" rx="14" fill="#4c0519" stroke="#fb7185"/><text x="1025" y="530" text-anchor="middle" fill="#fff">CI check</text><text x="1025" y="550" text-anchor="middle" fill="#fecdd3" font-size="10">artifact + schema integrity</text><rect x="1150" y="500" width="170" height="70" rx="14" fill="#1e293b" stroke="#94a3b8"/><text x="1235" y="530" text-anchor="middle" fill="#fff">bounded claim</text><text x="1235" y="550" text-anchor="middle" fill="#dce5ed" font-size="10">association only</text></g><text x="94" y="605" fill="#9cc7df" font-size="13">Current state: artifact-verifiable but not yet source-reproducible. The README makes that distinction explicit.</text></g></svg>