<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc"><title id="title">EDA mathematical map</title><desc id="desc">Adaptive light and dark visual showing feature vectors, covariance, correlation, pairwise geometry and evidence integrity while preserving the boundary that association is not causation.</desc><style>:root{--bg:#fff;--panel:#f8fafc;--fg:#0f172a;--muted:#475569;--border:#94a3b8;--obs:#0369a1;--state:#1d4ed8;--viable:#047857;--unc:#b45309;--haz:#b91c1c;--iface:#7e22ce;--dec:#a16207}@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--fg:#eaf1f8;--muted:#9eb0c3;--border:#355a7b;--obs:#38bdf8;--state:#60a5fa;--viable:#34d399;--unc:#fbbf24;--haz:#fb7185;--iface:#c084fc;--dec:#facc15}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.state{stroke:var(--state);fill:none}.viable{stroke:var(--viable);fill:none}.unc{stroke:var(--unc);fill:none}.haz{stroke:var(--haz);fill:none}.iface{stroke:var(--iface);fill:none}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><rect class="bg" width="1600" height="720" rx="28"/><text x="70" y="70" class="fg" font-size="35" font-weight="800">EXPLORATORY DATA ANALYSIS — MATHEMATICAL VIEW</text><text x="70" y="104" class="muted" font-size="16">feature space → covariance structure → normalized association → pairwise geometry → bounded interpretation</text><rect x="70" y="145" width="290" height="215" rx="18" class="panel"/><text x="94" y="181" class="fg" font-size="20" font-weight="700">Feature vector</text><text x="94" y="220" class="fg math" font-size="19">x=[x₁,x₂,…,xₚ]ᵀ</text><g fill="var(--state)"><circle cx="115" cy="280" r="8"/><circle cx="160" cy="250" r="8"/><circle cx="205" cy="302" r="8"/><circle cx="250" cy="236" r="8"/><circle cx="305" cy="270" r="8"/></g><path d="M115 280L160 250L205 302L250 236L305 270" class="state" stroke-width="3"/><path d="M360 252H420" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/>
<rect x="420" y="145" width="310" height="215" rx="18" class="panel"/><text x="444" y="181" class="fg" font-size="20" font-weight="700">Covariance</text><text x="444" y="220" class="fg math" font-size="18">Σ=𝔼[(X−μ)(X−μ)ᵀ]</text><g transform="translate(463 242)"><rect width="42" height="42" fill="var(--obs)" opacity=".9"/><rect x="44" width="42" height="42" fill="var(--state)" opacity=".7"/><rect x="88" width="42" height="42" fill="var(--iface)" opacity=".55"/><rect y="44" width="42" height="42" fill="var(--state)" opacity=".7"/><rect x="44" y="44" width="42" height="42" fill="var(--viable)" opacity=".9"/><rect x="88" y="44" width="42" height="42" fill="var(--unc)" opacity=".65"/><rect y="88" width="42" height="42" fill="var(--iface)" opacity=".55"/><rect x="44" y="88" width="42" height="42" fill="var(--unc)" opacity=".65"/><rect x="88" y="88" width="42" height="42" fill="var(--haz)" opacity=".8"/></g><text x="610" y="298" class="muted" font-size="12">scale-sensitive</text><path d="M730 252H790" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/>
<rect x="790" y="145" width="310" height="215" rx="18" class="panel"/><text x="814" y="181" class="fg" font-size="20" font-weight="700">Correlation</text><text x="814" y="220" class="fg math" font-size="18">ρᵢⱼ=Σᵢⱼ/(σᵢσⱼ)</text><path d="M830 326H1055M830 326V245" stroke="var(--muted)"/><g fill="var(--unc)"><circle cx="850" cy="310" r="5"/><circle cx="885" cy="298" r="5"/><circle cx="920" cy="282" r="5"/><circle cx="960" cy="270" r="5"/><circle cx="1000" cy="255" r="5"/></g><path d="M842 315L1010 250" class="unc" stroke-width="3"/><text x="870" y="344" class="muted" font-size="12">association ≠ causation</text><path d="M1100 252H1160" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/>
<rect x="1160" y="145" width="370" height="215" rx="18" class="panel"/><text x="1184" y="181" class="fg" font-size="20" font-weight="700">Pairwise geometry</text><text x="1184" y="220" class="muted" font-size="15">projection of multivariate structure</text><ellipse cx="1270" cy="292" rx="70" ry="28" transform="rotate(-24 1270 292)" class="state" stroke-width="3"/><ellipse cx="1410" cy="285" rx="55" ry="38" transform="rotate(18 1410 285)" class="haz" stroke-width="3"/><g fill="var(--iface)"><circle cx="1235" cy="305" r="4"/><circle cx="1260" cy="292" r="4"/><circle cx="1295" cy="278" r="4"/><circle cx="1378" cy="270" r="4"/><circle cx="1415" cy="291" r="4"/><circle cx="1445" cy="304" r="4"/></g>
<rect x="70" y="410" width="1460" height="225" rx="20" class="panel"/><text x="94" y="450" class="fg" font-size="20" font-weight="700">Evidence integrity pipeline</text><g transform="translate(100 500)" font-size="13" font-weight="700"><rect width="170" height="70" rx="14" fill="var(--obs)"/><text x="85" y="30" text-anchor="middle" fill="var(--bg)">heart1.csv</text><text x="85" y="50" text-anchor="middle" fill="var(--bg)" font-size="10">declared target a1p2</text><path d="M170 35H210" stroke="var(--muted)" marker-end="url(#a)"/><rect x="220" width="170" height="70" rx="14" fill="var(--viable)"/><text x="305" y="30" text-anchor="middle" fill="var(--bg)">EDA artifacts</text><text x="305" y="50" text-anchor="middle" fill="var(--bg)" font-size="10">heatmaps + pairplot</text><path d="M390 35H430" stroke="var(--muted)" marker-end="url(#a)"/><rect x="440" width="170" height="70" rx="14" fill="var(--iface)"/><text x="525" y="30" text-anchor="middle" fill="var(--bg)">report</text><text x="525" y="50" text-anchor="middle" fill="var(--bg)" font-size="10">human interpretation</text><path d="M610 35H650" stroke="var(--muted)" marker-end="url(#a)"/><rect x="660" width="190" height="70" rx="14" fill="var(--unc)"/><text x="755" y="30" text-anchor="middle" fill="var(--bg)">source status</text><text x="755" y="50" text-anchor="middle" fill="var(--bg)" font-size="10">analysis source incomplete</text><path d="M850 35H890" stroke="var(--muted)" marker-end="url(#a)"/><rect x="900" width="170" height="70" rx="14" fill="var(--haz)"/><text x="985" y="30" text-anchor="middle" fill="var(--bg)">CI check</text><text x="985" y="50" text-anchor="middle" fill="var(--bg)" font-size="10">artifact + schema</text><path d="M1070 35H1110" stroke="var(--muted)" marker-end="url(#a)"/><rect x="1120" width="200" height="70" rx="14" fill="var(--state)"/><text x="1220" y="30" text-anchor="middle" fill="var(--bg)">bounded claim</text><text x="1220" y="50" text-anchor="middle" fill="var(--bg)" font-size="10">association only</text></g><text x="94" y="605" class="muted" font-size="13">Current state: artifact-verifiable but not yet source-reproducible. Legacy PNG diagnostics are not inverted; they remain fixed evidence artifacts until their generating source is recovered.</text><text x="70" y="685" class="muted" font-size="13">Theme adaptation changes only the SVG presentation; dataset identity, statistics, associations and evidence status remain invariant.</text></svg>